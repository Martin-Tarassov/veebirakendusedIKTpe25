<!DOCTYPE html><!--deklaratsioon et kasutame html5-->
<!--kommentaar-->
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Martin veebirakenduste aluste tööd</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
          integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="
          crossorigin="anonymous"></script>
  <script src="tood/js/kuupaevaFunktsioonid.js"></script>
  <script>
    function koordLugemine(event, ui){
      let koht=ui.offset;
      $('#koordinadid').html('x:'+koht.left+ ' || y: '+koht.top);
    }
    function leheStart() {
      $('#vasakule').hide();

      $('#paremale').click(function () {
        $('#osa1').animate({left: '200px'}, 1000);
        $(this).hide();
        $('#vasakule').show();
      });

      $('#vasakule').click(function () {
        $('#osa1').animate({left: '0px'}, 1000);
        $(this).hide();
        $('#paremale').show();
      });

      $('#erapilt').draggable();
      $('#erapilt').bind("drag", koordLugemine);

      $('#jaljeriba').addClass('ul_kujundus');
      $('#jaljeriba li').addClass('li_kujundus');

      $('.vihjemull').mouseover(function (e) {
        var mull = $(this).attr('title');
        $(this).attr('title', '');
        $('body').append('<div id="vihje">' + mull + '</div>');
        $('#vihje').fadeIn('500');
        $('#vihje').fadeTo('10', 0.9);
      }).mousemove(function (e) {
        $('#vihje').css('top', e.pageY + 10);
        $('#vihje').css('left', e.pageX + 20);
      }).mouseout(function () {
        $(this).attr('title', $('#vihje').html());
        $('#vihje').fadeOut(300, function () {
          $(this).remove();
        });
      });
    }
  </script>
</head>
<body onload="leheStart()">
<!--veebilehe sisu, mis kasutaja näeb-->
<!--päis-->
<header>
  <h1>
    Martin veebirakenduste aluste tööd
  </h1>
</header>
<!--navegeerimismenüü-->
<nav>
  <ul>
    <li>
      <a href="index.html" class="vihjemull" title="Tagasi esilehele"> Avaleht</a>
    </li>
    <li>
      <a href="kontakt.html" class="vihjemull" title="Minu kontaktandmed">Kontakt</a>
    </li>
    <li>
      <a href ="tehtud.html" class="vihjemull" title="Kõik tehtud tööd on siin">Tehtud tööd</a>
    </li>
    <li>
      <a href="lingid.html" class="vihjemull" title="Lingid, mis aitavad õppida">Kasulikud lingid</a>
    </li>
    <li>
      <a href="meedia.html" class="vihjemull" title="Pildid ja muu meedia">Meedia leht</a>
    </li>
  </ul>
</nav>

<ul id="jaljeriba">
  <li>Avaleht</li>
</ul>

<!--sisu-->
<main>
  <section id="osa1">
    <h2>Tere tulemast</h2>
    <div id="tekstikast">
      <p>see on veebirakenduste tunniis käsitsi kirjatatud leht!</p>
      <br>
      <br>
      <p>palun kasuta navigeerimismenüü, et leida info</p>
    </div>
    <input type="button" value="paremale" id="paremale">
    <input type="button" value="vasakule" id="vasakule">
  </section>

  <section id="osa2">
    <h2>päevapilt</h2>
    <div>ise tehtud pilt
      <img src ="pilt.png" alt="see on kollane päike" id="erapilt">
    </div>
    <div id="koordinadid"></div>
  </section>
</main>

<!--jalus-->
<footer>
  <button onclick="kuvaKuupaevJaKell()" class="vihjemull" title="Näitab tänast kuupäeva ja kellaaega">täna on</button>
  <div>
    <p id="vastus"></p>
  </div>

  <br>

  <button onclick="synnipaevani()" class="vihjemull" title="Näitab, mitu päeva on sünnipäevani">Minu sünnipäevani</button>
  <div>
    <p id="vastus2"></p>
  </div>

  <div>
    Õpilane leht
  </div>
</footer>


</body>
</html>
