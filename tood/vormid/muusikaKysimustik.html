<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsitlus</title>
    <script src="../js/muusikaScript.js"></script>
    <link rel="stylesheet" href="muusikaStyle.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous"></script>
    <script>

        $(function(){
            // peidame vead
            $('.viga').hide();

            // puhastusnupp
            $('#Puhasta').click(function(){
                $('#muusikaVorm')[0].reset();
                $('.viga').hide();
            });

            // valideerimine, kui vorm on saadetud
            $('#muusikaVorm').submit(function(event){
                let valid = true;

                //nimi
                let nimi = $('#nimi').val().trim();
                if(nimi === "" || !/^[a-zA-ZõäöüšžÕÄÖÜŠŽ\s]+$/.test(nimi)){
                    $('#viga0').show();
                    valid = false;
                } else { $('#viga0').hide(); }

                // 1. Checkbox
                if($('input[name="muusik"]:checked').length === 0){
                    $('#viga1').show();
                    valid = false;
                } else { $('#viga1').hide(); }

                // 2. Textarea
                if($('#arvamus').val().trim() === ""){
                    $('#viga2').show();
                    valid = false;
                } else { $('#viga2').hide(); }

                // 3. Number (0–24)
                let tunnid = $('#tunnid').val();
                if(tunnid === "" || isNaN(tunnid) || tunnid < 0 || tunnid > 24){
                    $('#viga3').show();
                    valid = false;
                } else { $('#viga3').hide(); }

                // 4. Radio
                if($('input[name="raadio"]:checked').length === 0){
                    $('#viga4').show();
                    valid = false;
                } else { $('#viga4').hide(); }

                // 5. Text (ainult tähed)
                let tekst = $('#jaamad').val().trim();
                if(tekst === "" || !/^[a-zA-Z\s]+$/.test(tekst)){
                    $('#viga5').show();
                    valid = false;
                } else { $('#viga5').hide(); }

                // 6. Select
                if($('#stiil').val() === ""){
                    $('#viga6').show();
                    valid = false;
                } else { $('#viga6').hide(); }

                // kui on vead, siis ei ole vaja vormi saada
                if(!valid){
                    event.preventDefault();
                } else {
                    alert("Vorm on edukalt saadetud!");
                }
            });
        });
    </script>
</head>
<body>
<h1>Muusika küsitlus</h1>
<form action="#" id="muusikaVorm">
    <table border="1">
        <tr>
            <th>Küsimused</th>
            <th>Vastused</th>
            <th>Nimi</th>
        </tr>
        <!-- 0 -->
        <tr>
            <td>
                <label for="nimi">Sisesta oma nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" oninput="nimiLugemine()">
                <div class="viga" id="viga0">Kirjuta oma nimi</div>
            </td>
            <td>
                <div id="vastus"></div>
            </td>
        </tr>
        <!-- 1 -->
        <tr>
            <td>
                <fieldset>
                    <legend><strong>Milliseid muusikuid/ansambleid sa tead?</strong></legend>
                    <input type="checkbox" name="muusik" id="metallica" value="Metallica" onchange="muusikValik()">
                    <label for="metallica">Metallica</label>
                    <br>
                    <input type="checkbox" name="muusik" id="queen" value="Queen" onchange="muusikValik()">
                    <label for="queen">Queen</label>
                    <br>
                    <input type="checkbox" name="muusik" id="coldplay" value="Coldplay" onchange="muusikValik()">
                    <label for="coldplay">Coldplay</label>
                    <br>
                    <input type="checkbox" name="muusik" id="edsheeran" value="Ed Sheeran" onchange="muusikValik()">
                    <label for="edsheeran">Ed Sheeran</label>
                    <br>
                    <input type="checkbox" name="muusik" id="beatles" value="The Beatles" onchange="muusikValik()">
                    <label for="beatles">The Beatles</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus1"></div>
                <div class="viga" id="viga1">Vali vähemalt üks muusik</div>
            </td>
        </tr>
        <!-- 2 -->
        <tr>
            <td>
                <label for="arvamus"><strong>Mida arvad muusika kuulamisest koolis?</strong></label>
            </td>
            <td>
                <textarea id="arvamus" rows="4" cols="30" oninput="arvamusLugemine()"></textarea>
                <div id="vastus2"></div>
                <div class="viga" id="viga2">Palun kirjuta oma arvamus</div>
            </td>
        </tr>
        <!-- 3 -->
        <tr>
            <td>
                <label for="tunnid"><strong>Mitu tundi päevas sa kuulad muusikat?</strong></label>
            </td>
            <td>
                <input type="number" id="tunnid" min="0" max="24" step="1" oninput="tunnidLugemine()">
                <div id="vastus3"></div>
                <div class="viga" id="viga3">Sisesta arv vahemikus 0–24</div>
            </td>
        </tr>
        <!-- 4 -->
        <tr>
            <td>
                <strong>Kas sa kuulad raadiot?</strong>
            </td>
            <td>
                <input type="radio" name="raadio" id="jah" value="smile.png" onclick="raadioValik()">
                <label for="jah">jah</label>
                <input type="radio" name="raadio" id="ei" value="sad.png" onclick="raadioValik()">
                <label for="ei">ei</label>
                <div id="vastus4"></div>
                <div class="viga" id="viga4">Vali jah või ei</div>
            </td>
            <td>
                <img id="smaili" src="" alt="smaili" hidden>
            </td>
        </tr>
        <!-- 5 -->
        <tr>
            <td>
                <label for="jaamad"><strong>Milliseid raadiojaamu oskad nimetada?</strong></label>
            </td>
            <td>
                <input type="text" id="jaamad" oninput="jaamadLugemine()">
                <div id="vastus5"></div>
                <div class="viga" id="viga5">Nimeta raadiojaam </div>
            </td>
        </tr>
        <!-- 6 -->
        <tr>
            <td>
                <label for="stiil"><strong>Millist muusikat sa kõige rohkem kuulad?</strong></label>
            </td>
            <td>
                <select id="stiil" onchange="stiilValik()">
                    <option value="">vali...</option>
                    <option value="pop">pop</option>
                    <option value="rokk">rokk</option>
                    <option value="hiphop">hiphop</option>
                    <option value="klassikaline">klassikaline</option>
                    <option value="elektrooniline">elektrooniline</option>
                    <option value="jazz">jazz</option>
                </select>
                <div id="vastus6"></div>
                <div class="viga" id="viga6">Vali muusikastiil</div>
            </td>
        </tr>
        <!-- 7 ja 8 -->
        <tr>
            <td>
                <input type="reset" id="Puhasta" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="submit" id="Saada" value="Kontrolli">
            </td>
        </tr>
    </table>
</form>

<!-- THE END -->
<table border="1">
    <tr>
        <th>Kokkuvõte</th>
    </tr>
    <tr>
        <td>
            <div id="kokkuvote"></div>
        </td>
    </tr>
</table>
</body>
</html>
