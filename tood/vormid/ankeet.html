<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Sportlase ankeet</title>
</head>
<body>

<h1>Sportlase ankeet</h1>
<form action="#">
    <table border="1">
        <tr>
            <td>
                <label for="nimi">Sisesta oma nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi">
            </td>
        </tr>
        <tr>
            <td>
                <strong>Vali sugu:</strong>
            </td>
            <td>
                <input type="radio" name="sugu" id="naine">
                <label for="naine">naine</label>
                <br>
                <input type="radio" name="sugu" id="mees">
                <label for="mees">mees</label>
                <br>
                <input type="radio" name="sugu" id="muu">
                <label for="muu">muu</label>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <fieldset>
                    <legend><strong>Spordialad</strong></legend>
                    <input type="checkbox" name="spordiala" id="jooksmine">
                    <label for="jooksmine">jooksmine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="ujumine">
                    <label for="ujumine">ujumine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="uisutamine">
                    <label for="uisutamine">uisutamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="suusatamine">
                    <label for="suusatamine">suusatamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="poks">
                    <label for="poks">poks</label>
                </fieldset>
            </td>
        </tr>
        <tr>
            <td>
                <label for="tund">Mitu tundi nädalas sina treenid?</label>
            </td>
            <td>
                <input type="number" min="0" max="24" step="1" value="6" id="tund">
            </td>
        </tr>
        <tr>
            <td>
                <!-- rippmenüü -dropdownlist -->
                <label for="klubi">Mis klubi sa külastad?</label>
            </td>
            <td>
                <select name="klubi" id="klubi">
                    <option value="vali">vali...</option>
                    <option value="gym">GYM</option>
                    <option value="myfitness">myFitness</option>
                    <option value="gym24">GYM24</option>
                    <option value="kalevspa">KalevSPA</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <label for="varv">Mis värvi tossud sul on?</label>
            </td>
            <td>
                <input type="color" id="varv">
            </td>
        </tr>
        <tr>
            <td>
                <label for "kuupäev">Millal oli su viimane trenn?</label>
            </td>
            <td>
                <input type="date" id="kuupaev" min="">
            </td>
        </tr>
        <tr>

        </tr>

    </table>
</form>

</body>
</html>
