<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid HTML keeles</title>
    <link rel="stylesheet" href="tabeliStyle.css">
    <link rel="stylesheet" href="lipudStyle.css">
</head>
<body>
<h1>Tabelid HTML keeles</h1>
<h2>Kõige lihtsam tabel</h2>
<table id="sinine">
    <caption>Tabel 1.</caption>
    <!--1.rida-->
    <tr>
        <td> 1</td>
        <td> 2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td> 3</td>
        <td> 4</td>
    </tr>
</table>

<h2>Natuke keerulisem tabel</h2>
<table id="punane">
    <caption> Tabel 2.</caption>
    <!--1.rida-->
    <tr>
        <td colspan="2"> 2 </td>
    </tr>
    <!--2.rida-->
    <tr>
        <td> 3</td>
        <td> 4</td>
    </tr>
</table>

<h2>Veel üks natuke keerulisem tabel</h2>
<table id="roheline">
    <caption> Tabel 3.</caption>
    <!--1.rida-->
    <tr>
        <td rowspan="2">1 </td>
        <td>2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td> 4</td>
    </tr>
</table>


<h2>Iseseisev tabel</h2>
<table id="tabel4">
    <caption>Tabel 4</caption>
    <tr>
        <td rowspan="4">A</td>
        <td colspan="3">B</td>
    </tr>
    <tr>
        <td colspan="2">C</td>
        <td>D</td>
    </tr>
    <tr>
        <td>E</td>
        <td>F</td>
        <td rowspan="2">J</td>
    </tr>
    <tr>
        <td>G</td>
        <td>I</td>
    </tr>
</table>

<h2>Lipud</h2>
<table id="eesti">
    <caption>Eesti lipp</caption>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
    </tr>
    <tr>
        <td></td>
    </tr>
</table>

<table id="rootsi">
    <caption>Šveitsi lipp</caption>
    <tr>
        <td></td>
        <td></td>
        <td></td>
    </tr>
    <tr>
        <td></td>
        <td></td>
        <td></td>
    </tr>
    <tr>
        <td></td>
        <td></td>
        <td></td>
    </tr>
</table>

<h2>Hindeline töö</h2>
<table id="iseseisev">
    <caption>Hindeline töö</caption>
    <tr>
        <td colspan="4">A</td>
        <td rowspan="2">F</td>
    </tr>
    <tr>
        <td>B</td>
        <td>C</td>
        <td>D</td>
        <td>E</td>
    </tr>
    <tr>
        <td colspan="2">G</td>
        <td colspan="2" rowspan="2">H</td>
        <td rowspan="2">I</td>
    </tr>
    <tr>
        <td rowspan="2">J</td>
        <td>K</td>
    </tr>
    <tr>
        <td colspan="3">L</td>
        <td>M</td>
    </tr>
    </table>

</body>
</html>
