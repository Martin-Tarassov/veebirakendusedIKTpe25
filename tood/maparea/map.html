<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1> Lehel on kasutatud map area käsud</h1>
<p>palun kliki hiirega pildi erineva alale</p>
<img src="maja.png" alt="ilus majake" usemap="#majakaart" width="300" height="300">
<!-- kasutame map'i (kaart) -->
<map name="majakaart">
    <!-- ring -circle coords=x, y, R -->
    <area shape="circle" coords="60,55,40" href="paike.html" alt="päike">
    <!-- ristkülik - korsten (enne katust, et prioriteet oleks korstnal) -->
    <area shape="rect" coords="177,57,200,120" href="korsten.html" alt="korsten">
    <!-- polügoon -poly -->
    <area shape="poly" coords="150,5,215,10,270,25,275,55,245,70,205,55,160,40" href="suits.html" alt="suits">
    <!-- ristkülik - uks (enne seina, et prioriteet oleks uksel) -->
    <area shape="rect" coords="196,215,218,252" href="uks.html" alt="uks">
    <!-- ring - aken (enne seina, et prioriteet oleks aknal) -->
    <area shape="circle" coords="153,215,40" href="aken.html" alt="aken">
    <!-- polügoon - katus -->
    <area shape="poly" coords="152,80,80,160,228,160" href="katus.html" alt="katus">
    <!-- ristkülik - sein (viimane, sest kattub aknaga ja uksega) -->
    <area shape="rect" coords="78,162,228,262" href="sein.html" alt="sein">
</map>
<div id="selgitus">
    Vajuta pildiala peale. Siia tuleb väike kirjeldus...
</div>

</body>
</html>
