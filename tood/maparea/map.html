<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="mapStyle.css">
</head>
<body>
<h1> Lehel on kasutatud map area käsud</h1>
<h1>palun kliki hiirega pildi erineva alale</h1>
<img src="maja.png" alt="ilus majake" usemap="#majakaart">
<!-- kasutame map'i (kaart) -->
<map name="majakaart">
    <!-- ring -circle coords=x, y, R -->
    <area shape="circle" coords="77,69,40" href="paike.html" alt="päike">
    <!-- polügoon -poly -->
    <area shape="poly" coords="166,21,190,25,220,30,250,28,275,45,293,65,275,80,240,75,205,70,175,50" href="suits.html" alt="suits">
    <!-- polügoon - katus -->
    <area shape="poly" coords="176,91,97,179,258,179" href="katus.html" alt="katus">
    <!-- ristkülik - korsten -->
    <area shape="rect" coords="200,70,220,140" href="korsten.html" alt="korsten">
    <!-- ring - aken (enne seina, et prioriteet oleks aknal) -->
    <area shape="circle" coords="168,223,28" href="aken.html" alt="aken">
    <!-- ristkülik - uks -->
    <area shape="rect" coords="223,233,248,277" href="uks.html" alt="uks">
    <!-- ristkülik - sein (kitsendatud, et ei kataks aknat) -->
    <area shape="rect" coords="97,260,258,277" href="sein.html" alt="sein">
</map>
<div id="selgitus">
    Vajuta pildiala peale. Siia tuleb väike kirjeldus...
</div>

</body>
</html>
